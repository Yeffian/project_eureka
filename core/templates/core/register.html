{% extends "base.html" %}

{% block title %}Project Eureka — Register{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-5 pt-10 pb-20">

  <!-- ░░ Hero ░░ -->
  <div class="reveal text-center mb-10">
    <p class="inline-block rounded-full bg-butter px-3 py-1 text-xs font-bold uppercase tracking-widest mb-5">New here?</p>
    <h1 class="font-display text-5xl font-bold leading-[1.05] mb-3">Create account</h1>
    <p class="text-inksoft text-lg leading-relaxed">Two minutes and you're in.</p>

    <!-- hand-drawn dashed divider -->
    <svg viewBox="0 0 600 14" class="w-full max-w-xs mx-auto block mt-8" aria-hidden="true">
      <path d="M8 8 C 60 4 110 12 170 7 C 230 3 290 11 350 7 C 410 4 470 11 530 7 C 555 6 575 8 592 7" fill="none" stroke="#3E4C54" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 12"/>
    </svg>
  </div>

  <!-- ░░ Form card ░░ -->
  <div class="reveal rounded-blob bg-cream border-2 border-ink/15 shadow-[6px_6px_0_0_rgba(62,76,84,0.18)] p-8">

    {% if message %}
      <div class="mb-6 rounded-2xl bg-blush/40 border-2 border-ink/15 px-4 py-3 text-sm">
        {{ message }}
      </div>
    {% endif %}

    <form action="{% url 'core:register' %}" method="post" class="space-y-5" novalidate>
      {% csrf_token %}

      <div>
        <label for="username" class="block text-sm font-bold mb-1.5">Username</label>
        <input autofocus type="text" id="username" name="username" required class="doodle-input" placeholder="ashleyt">
      </div>

      <div>
        <label for="email" class="block text-sm font-bold mb-1.5">Email <span class="text-lilac">*</span></label>
        <input type="email" id="email" name="email" required class="doodle-input" placeholder="you@example.com">
      </div>

      <div>
        <label for="password" class="block text-sm font-bold mb-1.5">Password</label>
        <input type="password" id="password" name="password" required class="doodle-input" placeholder="••••••••">
      </div>

      <div>
        <label for="confirmation" class="block text-sm font-bold mb-1.5">Confirm password</label>
        <input type="password" id="confirmation" name="confirmation" required class="doodle-input" placeholder="••••••••">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-full bg-ink text-cream px-6 py-3 font-bold hover:bg-ink/80 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          Create account
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </form>
  </div>

  <!-- ░░ Login link ░░ -->
  <p class="reveal mt-6 text-center text-sm text-inksoft">
    Already have an account?
    <a href="{% url 'core:login' %}" class="squiggle-link font-bold text-ink">Sign in here</a>.
  </p>
</section>
{% endblock %}
